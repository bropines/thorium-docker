services:
  thorium-browser:
    image: ghcr.io/bropines/thorium-docker:latest
    container_name: thorium-browser
    restart: unless-stopped
    ports:
      - "9222:9222"
    environment:
      - USE_XVFB=true
      - DISABLE_PASSKEYS=true
      - DISABLE_AUTOMATION=true
      - USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.7204.303 Safari/537.36
      - >-
        EXTRA_FLAGS=
        --remote-debugging-port=9222
        --remote-debugging-address=0.0.0.0
        --remote-allow-origins=*
        --password-store=basic
        --no-first-run
        --no-default-browser-check
        --disable-save-password-bubble
        --disable-notifications
        --disable-autofill
        --disable-features=WebAuthentication,WebAuthenticationUI,Passkeys,PasskeyAuthenticator,PasswordManager,CredentialManager,GooglePasswordManager,AutofillServerCommunication
        --window-size=1280,720
        https://google.com
    volumes:
      - ./profile:/data/thorium_profile