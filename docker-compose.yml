version: '3.8'

services:
  # Alpine Linux CDP service
  thorium-alpine:
    image: ghcr.io/bropines/thorium-docker:alpine
    container_name: thorium-alpine
    restart: unless-stopped
    ports:
      - "9222:9222"
    volumes:
      - ./MSG/thorium_profile:/data/thorium_profile
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Ready-to-use production CDP service pulling pre-built AVX2 image from GHCR
  thorium-browser:
    image: ghcr.io/bropines/thorium-docker:latest
    container_name: thorium-browser
    restart: unless-stopped
    ports:
      - "9222:9222"
    volumes:
      - ./MSG/thorium_profile:/data/thorium_profile
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  thorium-headless-avx2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        THORIUM_VERSION: M138.0.7204.303
        INSTRUCTION_SET: AVX2
    container_name: thorium-headless-avx2
    ports:
      - "9222:9222"
    volumes:
      - ./thorium_profile_avx2:/data/thorium_profile
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped

  thorium-headless-avx:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        THORIUM_VERSION: M138.0.7204.303
        INSTRUCTION_SET: AVX
    container_name: thorium-headless-avx
    ports:
      - "9223:9222"
    volumes:
      - ./thorium_profile_avx:/data/thorium_profile
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped

  thorium-headless-sse3:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        THORIUM_VERSION: M138.0.7204.303
        INSTRUCTION_SET: SSE3
    container_name: thorium-headless-sse3
    ports:
      - "9224:9222"
    volumes:
      - ./thorium_profile_sse3:/data/thorium_profile
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped

  thorium-headless-sse4:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        THORIUM_VERSION: M138.0.7204.303
        INSTRUCTION_SET: SSE4
    container_name: thorium-headless-sse4
    ports:
      - "9225:9222"
    volumes:
      - ./thorium_profile_sse4:/data/thorium_profile
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped