name: Build and Push Thorium Docker Images (Stable & Beta)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target_channel:
        description: 'Channel to build (stable, beta, or all)'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  STABLE_VERSION: "M138.0.7204.303"
  BETA_VERSION: "M138Beta1"

jobs:
  build-thorium-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        channel: [stable, beta]
        instruction_set: [AVX2, AVX, SSE3, SSE4]
      fail-fast: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Thorium Version
        id: set-version
        run: |
          if [ "${{ matrix.channel }}" = "stable" ]; then
            echo "version=${{ env.STABLE_VERSION }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ env.BETA_VERSION }}" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.channel }}-${{ matrix.instruction_set }}
            type=raw,value=${{ matrix.channel }},enable=${{ matrix.instruction_set == 'AVX2' }}
            type=raw,value=latest-${{ matrix.instruction_set }},enable=${{ matrix.channel == 'stable' }}
            type=raw,value=latest,enable=${{ matrix.channel == 'stable' && matrix.instruction_set == 'AVX2' }}
            type=raw,value=${{ matrix.instruction_set }},enable=${{ matrix.channel == 'stable' }}

      - name: Check if channel should be built
        id: check-channel
        run: |
          INPUT_CHANNEL="${{ github.event.inputs.target_channel }}"
          if [ "$INPUT_CHANNEL" = "all" ] || [ -z "$INPUT_CHANNEL" ] || [ "$INPUT_CHANNEL" = "${{ matrix.channel }}" ]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
          else
            echo "should-build=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Thorium Docker image (${{ matrix.channel }} - ${{ matrix.instruction_set }})
        if: steps.check-channel.outputs.should-build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            THORIUM_VERSION=${{ steps.set-version.outputs.version }}
            INSTRUCTION_SET=${{ matrix.instruction_set }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max