name: Build and Push Thorium Docker Images

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      instruction_set:
        description: 'Instruction set to build (AVX2, AVX, SSE3, SSE4, or all)'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-thorium-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        instruction_set: [AVX2, AVX, SSE3, SSE4]
      fail-fast: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest-${{ matrix.instruction_set }}
            type=raw,value=${{ matrix.instruction_set }}
            type=raw,value=debian-${{ matrix.instruction_set }}
            type=raw,value=latest,enable=${{ matrix.instruction_set == 'AVX2' }}

      - name: Check if instruction set should be built
        id: check-instruction-set
        run: |
          INPUT_SET="${{ github.event.inputs.instruction_set }}"
          if [ "$INPUT_SET" = "all" ] || [ -z "$INPUT_SET" ] || [ "$INPUT_SET" = "${{ matrix.instruction_set }}" ]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
          else
            echo "should-build=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Thorium Docker image (${{ matrix.instruction_set }})
        if: steps.check-instruction-set.outputs.should-build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTRUCTION_SET=${{ matrix.instruction_set }}
          cache-from: type=gha
          cache-to: type=gha,mode=max